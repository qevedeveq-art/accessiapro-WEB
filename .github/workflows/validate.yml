name: Validate public site

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit public files and SEO invariants
        run: node tests/audit-site.mjs

      - name: Run contract tests
        run: node --test tests/*.test.mjs

      - name: Check browser JavaScript syntax
        run: |
          node --check assets/js/autodiagnostic-maturite.js
          node --check assets/js/calculateur-roi.js
