name: Validate public site

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Audit public files and SEO invariants
        run: node tests/audit-site.mjs

      - name: Run contract tests
        run: node --test tests/*.test.mjs

      - name: Check browser JavaScript syntax
        run: npm run check:js

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 7
