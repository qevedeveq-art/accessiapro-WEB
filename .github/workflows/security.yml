name: Security & Availability Check

on:
  schedule:
    - cron: '0 7 * * 1'   # chaque lundi à 7h
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-check:
    runs-on: ubuntu-latest
    name: Check headers, HTTPS and links

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check HTTPS availability (primary CDN)
        run: |
          STATUS=$(curl --silent --show-error --max-time 30 \
            -o /dev/null -w "%{http_code}" https://access-ia.pro)
          echo "HTTP status (CDN): $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Primary domain returned $STATUS" && exit 1
          fi

      - name: Verify HTTP redirects to HTTPS
        run: |
          REDIRECT=$(curl --silent --show-error --max-time 30 \
            -o /dev/null -w "%{redirect_url}" http://access-ia.pro)
          echo "Redirect target: $REDIRECT"
          if [[ "$REDIRECT" != https* ]]; then
            echo "ERROR: HTTP does not redirect to HTTPS" && exit 1
          fi

      - name: Check security headers (CDN)
        run: |
          HEADERS=$(curl --silent --show-error --max-time 30 \
            --head https://access-ia.pro)
          echo "$HEADERS"
          for HEADER in "strict-transport-security" "x-content-type-options" "x-frame-options" "content-security-policy"; do
            if echo "$HEADERS" | grep -qi "$HEADER"; then
              echo "OK: $HEADER present"
            else
              echo "MISSING: $HEADER" && exit 1
            fi
          done

      - name: Check referrer-policy header
        run: |
          HEADERS=$(curl --silent --show-error --max-time 30 \
            --head https://access-ia.pro)
          if echo "$HEADERS" | grep -qi "referrer-policy"; then
            echo "OK: referrer-policy present"
          else
            echo "WARNING: referrer-policy missing (recommended for privacy)"
          fi

      - name: Check SSL certificate expiry (CDN domain)
        run: |
          EXPIRY=$(echo | openssl s_client -connect access-ia.pro:443 -servername access-ia.pro 2>/dev/null \
            | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
          echo "Certificate expires: $EXPIRY"
          EXPIRY_EPOCH=$(date -d "$EXPIRY" +%s)
          NOW_EPOCH=$(date +%s)
          DAYS_LEFT=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))
          echo "Days until expiry: $DAYS_LEFT"
          if [ "$DAYS_LEFT" -lt 7 ]; then
            echo "::error::Certificate expires in less than 7 days"
            exit 1
          elif [ "$DAYS_LEFT" -lt 30 ]; then
            echo "::warning::Certificate expires in less than 30 days"
          fi

      - name: HTML validation (basic)
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --output /tmp/accessia-homepage.html https://access-ia.pro
          grep -q "ACCESSIA Pro" /tmp/accessia-homepage.html \
            && echo "OK: Page content valid" \
            || (echo "ERROR: Page content missing" && exit 1)

      - name: Notify on failure
        if: failure()
        run: |
          echo "Security check failed — check GitHub Actions logs"
          echo "Contact: qevedeveq@gmail.com"

  routing-check:
    runs-on: ubuntu-latest
    name: Compare public DNS with GCP CDN

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Compare apex DNS with the CDN frontend
        env:
          GCP_URL_MAP: accessia-pro-lb
        run: |
          set -euo pipefail

          PROXY=$(gcloud compute target-https-proxies list \
            --filter="urlMap~${GCP_URL_MAP}" \
            --limit=1 \
            --format="value(name)")
          if [ -z "$PROXY" ]; then
            echo "::warning::No HTTPS proxy found for URL map ${GCP_URL_MAP}"
            exit 0
          fi

          CDN_IP=$(gcloud compute forwarding-rules list \
            --global \
            --filter="target~${PROXY}" \
            --limit=1 \
            --format="value(IPAddress)")
          if [ -z "$CDN_IP" ]; then
            echo "::warning::No global forwarding IP found for proxy ${PROXY}"
            exit 0
          fi

          DNS_IP=$(getent ahostsv4 access-ia.pro | awk 'NR == 1 { print $1 }')
          echo "GCP CDN frontend IP: $CDN_IP"
          echo "Public DNS A record: $DNS_IP"

          if [ "$DNS_IP" != "$CDN_IP" ]; then
            echo "::warning::The apex domain does not currently route to the GCP CDN frontend"
          else
            echo "OK: apex DNS routes to the GCP CDN frontend"
          fi
