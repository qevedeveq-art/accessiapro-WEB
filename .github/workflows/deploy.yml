name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated build to production
        required: true
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  SITE_DIR: /tmp/accessia-site
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & prepare deploy artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Audit public repository boundaries
        run: node tests/audit-repository.mjs .

      - name: Prepare deploy directory
        run: |
          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR"
          rsync -az \
            ./*.html \
            ./*.txt \
            ./*.xml \
            ./*.ico \
            ./*.webmanifest \
            "$SITE_DIR/"
          for directory in .well-known assets articles guides ressources; do
            mkdir -p "$SITE_DIR/$directory"
            rsync -az "$directory/" "$SITE_DIR/$directory/"
          done

      - name: Minify CSS and JS
        run: |
          npm install -g clean-css-cli@5.6.3 uglify-js@3.19.3 --silent
          cleancss "$SITE_DIR/assets/css/style.css" > /tmp/style.min.css
          mv /tmp/style.min.css "$SITE_DIR/assets/css/style.css"
          uglifyjs "$SITE_DIR/assets/js/main.v2.js" -c -m > /tmp/main.min.js
          mv /tmp/main.min.js "$SITE_DIR/assets/js/main.v2.js"

      - name: Minify HTML
        run: |
          npm install -g html-minifier-terser@7.2.0 --silent
          find "$SITE_DIR" -name "*.html" | while read f; do
            html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --remove-optional-tags \
              --remove-redundant-attributes \
              --use-short-doctype \
              --minify-css true \
              --minify-js true \
              "$f" -o "$f"
          done

      - name: Subset fonts
        run: |
          pip install fonttools==4.62.1 brotli==1.2.0 --quiet
          python3 - <<'PYEOF'
          import os, re
          chars = set()
          site_dir = os.environ['SITE_DIR']
          for root, dirs, files in os.walk(site_dir):
              for f in files:
                  if f.endswith('.html'):
                      with open(os.path.join(root, f), encoding='utf-8', errors='ignore') as fh:
                          chars.update(re.sub('<[^>]+>', ' ', fh.read()))
          with open('/tmp/used_chars.txt', 'w') as out:
              out.write(''.join(sorted(chars)))
          PYEOF
          echo "Unique chars: $(wc -c < /tmp/used_chars.txt)"
          for weight in 400 500 600 700 800; do
            pyftsubset "$SITE_DIR/assets/fonts/inter-${weight}.woff2" \
              --text-file=/tmp/used_chars.txt \
              --flavor=woff2 \
              --output-file="/tmp/inter-${weight}.woff2" 2>/dev/null \
              && mv "/tmp/inter-${weight}.woff2" "$SITE_DIR/assets/fonts/inter-${weight}.woff2" \
              || echo "Subset skipped for inter-${weight}.woff2"
          done

      - name: Audit prepared public site
        run: node tests/audit-site.mjs "$SITE_DIR"

      - name: Verify deploy directory
        run: |
          test -f "$SITE_DIR/index.html" || (echo "ERROR: index.html missing" && exit 1)
          test -f "$SITE_DIR/sitemap.xml" || (echo "ERROR: sitemap.xml missing" && exit 1)
          test -f "$SITE_DIR/robots.txt" || (echo "ERROR: robots.txt missing" && exit 1)
          test -f "$SITE_DIR/favicon.ico" || (echo "ERROR: favicon.ico missing" && exit 1)
          test -f "$SITE_DIR/assets/images/favicon.svg" || (echo "ERROR: favicon.svg missing" && exit 1)
          test -d "$SITE_DIR/assets" || (echo "ERROR: assets/ missing" && exit 1)
          test -d "$SITE_DIR/articles" || (echo "ERROR: articles/ missing" && exit 1)
          echo "Build verification PASSED"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: site-build
          path: ${{ env.SITE_DIR }}
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    name: Deploy to production

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: site-build
          path: ${{ env.SITE_DIR }}

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Trust host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p "$HOME/.ssh"
          TRUSTED="$HOME/.ssh/hosts_trusted"
          ssh-keyscan -t ed25519,rsa -H "$DEPLOY_HOST" > "$TRUSTED"
          echo "RSYNC_RSH=ssh -o UserKnownHostsFile=$TRUSTED" >> "$GITHUB_ENV"

      - name: Rsync site to production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            --exclude='.git*' \
            "$SITE_DIR/" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"

      - name: Verify public release
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            HOME_STATUS=$(curl --silent --show-error --max-time 30 \
              -o /tmp/home.html -w "%{http_code}" https://access-ia.pro/ || true)
            MENACES_STATUS=$(curl --silent --show-error --max-time 30 \
              -o /dev/null -w "%{http_code}" \
              https://access-ia.pro/articles/menaces-ia-2026.html || true)
            SITEMAP_COUNT=$(curl --silent --show-error --max-time 30 \
              https://access-ia.pro/sitemap.xml \
              | grep -o '<loc>' | wc -l | tr -d ' ' || true)
            if [ "$HOME_STATUS" = "200" ] \
              && [ "$MENACES_STATUS" = "200" ] \
              && [ "$SITEMAP_COUNT" = "16" ] \
              && grep -qi "projet en préparation" /tmp/home.html; then
              echo "Public release verified on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt: home=$HOME_STATUS menaces=$MENACES_STATUS sitemap=$SITEMAP_COUNT"
            sleep 10
          done
          echo "ERROR: public verification failed"
          exit 1

  notify-indexnow:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    name: Notify search engines (IndexNow — Bing, Yandex, Naver, Seznam)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify IndexNow key file is reachable
        run: |
          curl -fsSL https://access-ia.pro/89c0ec51c78fbd47f1dcc08b1443d075.txt \
            | grep -q "89c0ec51c78fbd47f1dcc08b1443d075" \
            && echo "Key file OK" \
            || { echo "::error::IndexNow key file unreachable"; exit 1; }

      - name: Ping IndexNow with all sitemap URLs
        run: bash scripts/ping-indexnow.sh
