name: Deploy — GCS + CDN

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated build to the public GCS/CDN target
        required: true
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  SITE_DIR: /tmp/accessia-site
  GCS_BUCKET: gs://accessia-pro-web
  GCP_BACKEND_BUCKET: accessia-pro-backend
  GCP_URL_MAP: accessia-pro-lb
  GCP_HTTPS_IP: 34.102.254.53
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & prepare deploy artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Audit public repository boundaries
        run: node tests/audit-repository.mjs .

      - name: Prepare deploy directory
        run: |
          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR"
          rsync -az \
            ./*.html \
            ./*.txt \
            ./*.xml \
            ./*.ico \
            ./*.webmanifest \
            "$SITE_DIR/"
          for directory in .well-known assets articles guides ressources; do
            mkdir -p "$SITE_DIR/$directory"
            rsync -az "$directory/" "$SITE_DIR/$directory/"
          done

      - name: Minify CSS and JS
        run: |
          npm install -g clean-css-cli@5.6.3 uglify-js@3.19.3 --silent
          cleancss "$SITE_DIR/assets/css/style.css" > /tmp/style.min.css
          mv /tmp/style.min.css "$SITE_DIR/assets/css/style.css"
          uglifyjs "$SITE_DIR/assets/js/main.v2.js" -c -m > /tmp/main.min.js
          mv /tmp/main.min.js "$SITE_DIR/assets/js/main.v2.js"

      - name: Minify HTML
        run: |
          npm install -g html-minifier-terser@7.2.0 --silent
          find "$SITE_DIR" -name "*.html" | while read f; do
            html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --remove-optional-tags \
              --remove-redundant-attributes \
              --use-short-doctype \
              --minify-css true \
              --minify-js true \
              "$f" -o "$f"
          done

      - name: Subset fonts
        run: |
          pip install fonttools==4.62.1 brotli==1.2.0 --quiet
          python3 - <<'PYEOF'
          import os, re
          chars = set()
          site_dir = os.environ['SITE_DIR']
          for root, dirs, files in os.walk(site_dir):
              for f in files:
                  if f.endswith('.html'):
                      with open(os.path.join(root, f), encoding='utf-8', errors='ignore') as fh:
                          chars.update(re.sub('<[^>]+>', ' ', fh.read()))
          with open('/tmp/used_chars.txt', 'w') as out:
              out.write(''.join(sorted(chars)))
          PYEOF
          echo "Unique chars: $(wc -c < /tmp/used_chars.txt)"
          for weight in 400 500 600 700 800; do
            pyftsubset "$SITE_DIR/assets/fonts/inter-${weight}.woff2" \
              --text-file=/tmp/used_chars.txt \
              --flavor=woff2 \
              --output-file="/tmp/inter-${weight}.woff2" 2>/dev/null \
              && mv "/tmp/inter-${weight}.woff2" "$SITE_DIR/assets/fonts/inter-${weight}.woff2" \
              || echo "Subset skipped for inter-${weight}.woff2"
          done

      - name: Audit prepared public site
        run: node tests/audit-site.mjs "$SITE_DIR"

      - name: Verify deploy directory
        run: |
          test -f "$SITE_DIR/index.html" || (echo "ERROR: index.html missing" && exit 1)
          test -f "$SITE_DIR/sitemap.xml" || (echo "ERROR: sitemap.xml missing" && exit 1)
          test -f "$SITE_DIR/robots.txt" || (echo "ERROR: robots.txt missing" && exit 1)
          test -f "$SITE_DIR/favicon.ico" || (echo "ERROR: favicon.ico missing" && exit 1)
          test -f "$SITE_DIR/assets/images/favicon.svg" || (echo "ERROR: favicon.svg missing" && exit 1)
          test -d "$SITE_DIR/assets" || (echo "ERROR: assets/ missing" && exit 1)
          test -d "$SITE_DIR/articles" || (echo "ERROR: articles/ missing" && exit 1)
          echo "Build verification PASSED"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: site-build
          path: ${{ env.SITE_DIR }}
          retention-days: 7

  deploy-gcs:
    needs: build
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    name: Deploy to Google Cloud Storage + CDN

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: site-build
          path: ${{ env.SITE_DIR }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Sync files to GCS bucket
        run: |
          gsutil -m rsync -r -d "$SITE_DIR" "$GCS_BUCKET"

      - name: Set content-type for fonts
        run: |
          gsutil -m setmeta \
            -h "Content-Type:font/woff2" \
            "$GCS_BUCKET/assets/fonts/*.woff2" || true

      - name: Set cache headers for static assets
        run: |
          gsutil -m setmeta \
            -h "Cache-Control:public, max-age=31536000, immutable" \
            "$GCS_BUCKET/assets/css/*.css" \
            "$GCS_BUCKET/assets/js/*.js" \
            "$GCS_BUCKET/assets/images/*.webp" \
            "$GCS_BUCKET/assets/images/*.png" \
            "$GCS_BUCKET/assets/images/*.jpg" \
            "$GCS_BUCKET/assets/images/*.svg" \
            "$GCS_BUCKET/assets/fonts/*.woff2" || true
          gsutil -m setmeta \
            -h "Cache-Control:public, max-age=3600, must-revalidate" \
            "$GCS_BUCKET/robots.txt" \
            "$GCS_BUCKET/sitemap.xml" \
            "$GCS_BUCKET/favicon.ico"
          gsutil -m setmeta \
            -h "Cache-Control:public, max-age=300, must-revalidate" \
            -h "Content-Type:text/html; charset=utf-8" \
            "$GCS_BUCKET/*.html" \
            "$GCS_BUCKET/articles/*.html" \
            "$GCS_BUCKET/guides/*/*.html" \
            "$GCS_BUCKET/ressources/*.html"
          gsutil -m setmeta \
            -h "Cache-Control:public, max-age=300, must-revalidate" \
            -h "Content-Type:text/plain; charset=utf-8" \
            "$GCS_BUCKET/llms.txt"

      - name: Set security response headers on backend bucket
        run: |
          gcloud compute backend-buckets describe "$GCP_BACKEND_BUCKET" \
            --format="value(name)" >/dev/null
          gcloud compute backend-buckets update "$GCP_BACKEND_BUCKET" \
            --custom-response-header='Strict-Transport-Security:max-age=63072000' \
            --custom-response-header="Content-Security-Policy:default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; form-action 'self' mailto:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests" \
            --custom-response-header='X-Frame-Options:DENY' \
            --custom-response-header='X-Content-Type-Options:nosniff' \
            --custom-response-header='Referrer-Policy:strict-origin-when-cross-origin' \
            --custom-response-header='Permissions-Policy:camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()' \
            --custom-response-header='Cross-Origin-Opener-Policy:same-origin' \
            --custom-response-header='Cross-Origin-Resource-Policy:same-origin'
          echo "Security headers applied to $GCP_BACKEND_BUCKET"

      - name: Invalidate CDN cache
        run: |
          gcloud compute url-maps invalidate-cdn-cache "$GCP_URL_MAP" \
            --path "/*" \
            --global \
            --async

      - name: Verify the deployed GCS release
        run: |
          set -euo pipefail
          gsutil cat "$GCS_BUCKET/index.html" \
            | grep -qi "projet en préparation"
          gsutil stat "$GCS_BUCKET/articles/comparatif-ia-cloud-locale-pme.html" >/dev/null
          SITEMAP_COUNT="$(gsutil cat "$GCS_BUCKET/sitemap.xml" \
            | grep -o '<loc>' | wc -l | tr -d ' ')"
          if [ "$SITEMAP_COUNT" != "15" ]; then
            echo "ERROR: deployed sitemap contains $SITEMAP_COUNT URLs, expected 15"
            exit 1
          fi
          echo "Deployed GCS release verified"

  verify-public:
    needs: deploy-gcs
    runs-on: ubuntu-latest
    name: Verify the public apex
    outputs:
      apex_ready: ${{ steps.apex-dns.outputs.ready }}

    steps:
      - name: Check whether the apex points to the validated GCP frontend
        id: apex-dns
        run: |
          set -euo pipefail
          APEX_IP="$(getent ahostsv4 access-ia.pro | awk 'NR == 1 { print $1 }' || true)"
          if [ "$APEX_IP" = "$GCP_HTTPS_IP" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Public apex remains on $APEX_IP; GCS deployment succeeded and public verification is deferred."
          fi

      - name: Wait for the validated release to become public
        if: steps.apex-dns.outputs.ready == 'true'
        run: |
          for attempt in $(seq 1 12); do
            HOME_STATUS=$(curl --silent --show-error --max-time 30 \
              -o /tmp/accessia-home.html -w "%{http_code}" https://access-ia.pro/ \
              || true)
            ARTICLE_STATUS=$(curl --silent --show-error --max-time 30 \
              -o /tmp/accessia-comparison.html -w "%{http_code}" \
              https://access-ia.pro/articles/comparatif-ia-cloud-locale-pme.html \
              || true)
            SITEMAP_COUNT=$(curl --silent --show-error --max-time 30 \
              https://access-ia.pro/sitemap.xml \
              | grep -o '<loc>' | wc -l | tr -d ' ' || true)
            if [ "$HOME_STATUS" = "200" ] \
              && [ "$ARTICLE_STATUS" = "200" ] \
              && [ "$SITEMAP_COUNT" = "15" ] \
              && grep -qi "projet en préparation" /tmp/accessia-home.html; then
              echo "Public release verified on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt: home=$HOME_STATUS article=$ARTICLE_STATUS sitemap=$SITEMAP_COUNT"
            sleep 10
          done
          echo "ERROR: the public apex does not serve the validated release"
          exit 1

      - name: Verify public security headers
        if: steps.apex-dns.outputs.ready == 'true'
        run: |
          HEADERS=$(curl --silent --show-error --max-time 30 --head https://access-ia.pro/)
          for HEADER in strict-transport-security content-security-policy x-content-type-options x-frame-options referrer-policy; do
            echo "$HEADERS" | grep -qi "$HEADER" \
              || { echo "ERROR: missing $HEADER"; exit 1; }
          done


  notify-indexnow:
    needs: verify-public
    if: needs.verify-public.outputs.apex_ready == 'true'
    runs-on: ubuntu-latest
    name: Notify search engines (IndexNow — Bing, Yandex, Naver, Seznam)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify IndexNow key file is reachable
        run: |
          curl -fsSL https://access-ia.pro/89c0ec51c78fbd47f1dcc08b1443d075.txt \
            | grep -q "89c0ec51c78fbd47f1dcc08b1443d075" \
            && echo "Key file OK" \
            || { echo "::error::IndexNow key file unreachable"; exit 1; }

      - name: Ping IndexNow with all sitemap URLs
        run: bash scripts/ping-indexnow.sh
