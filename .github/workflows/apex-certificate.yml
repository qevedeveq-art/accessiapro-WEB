name: Apex certificate — GCP DNS authorization

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect: read-only audit; prepare: create and validate the apex-only DNS authorization and certificate"
        required: true
        type: choice
        options:
          - inspect
          - prepare
        default: inspect

concurrency:
  group: apex-certificate
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  DOMAIN: access-ia.pro
  DNS_AUTHORIZATION: accessia-pro-apex-dns-auth
  CERTIFICATE: accessia-pro-apex-cert
  GCP_PROJECT: accessia-pro-web
  GCP_URL_MAP: accessia-pro-lb
  GCP_HTTPS_PROXY: accessia-pro-https-proxy
  GCP_HTTPS_IP: 34.95.112.139
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  manage-apex-certificate:
    runs-on: ubuntu-latest
    name: Manage apex-only Certificate Manager resources

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Confirm project and current load balancer path
        run: |
          set -euo pipefail
          PROJECT_ID="$(gcloud config get-value project)"
          if [ "$PROJECT_ID" != "$GCP_PROJECT" ]; then
            echo "ERROR: authenticated project is $PROJECT_ID, expected $GCP_PROJECT"
            exit 1
          fi

          gcloud compute url-maps describe "$GCP_URL_MAP" \
            --global \
            --format="value(name)" >/dev/null

          PROXY_URL_MAP="$(gcloud compute target-https-proxies describe "$GCP_HTTPS_PROXY" \
            --global \
            --format='value(urlMap)')"
          if [ "${PROXY_URL_MAP##*/}" != "$GCP_URL_MAP" ]; then
            echo "ERROR: HTTPS proxy $GCP_HTTPS_PROXY uses ${PROXY_URL_MAP##*/}, expected $GCP_URL_MAP"
            exit 1
          fi

          echo "Project: $PROJECT_ID"
          echo "HTTPS proxy (read-only audit):"
          gcloud compute target-https-proxies describe "$GCP_HTTPS_PROXY" \
            --global \
            --format="yaml(name,urlMap,certificateMap,sslCertificates)"
          echo "URL map host rules (read-only audit):"
          gcloud compute url-maps describe "$GCP_URL_MAP" \
            --global \
            --format="yaml(name,defaultService,hostRules,pathMatchers.name)"
          echo "Forwarding rules (read-only audit):"
          gcloud compute forwarding-rules list \
            --global \
            --filter="target~'/global/targetHttpsProxies/${GCP_HTTPS_PROXY}$'" \
            --format="table(name,IPAddress,IPProtocol,portRange,target)"

          FORWARDING_IPS="$(gcloud compute forwarding-rules list \
            --global \
            --filter="target~'/global/targetHttpsProxies/${GCP_HTTPS_PROXY}$' AND IPProtocol=TCP AND portRange=443-443" \
            --format='value(IPAddress)')"
          if [ "$FORWARDING_IPS" != "$GCP_HTTPS_IP" ]; then
            echo "ERROR: HTTPS proxy does not resolve uniquely to $GCP_HTTPS_IP:443"
            exit 1
          fi

      - name: Prepare DNS authorization and certificate
        if: inputs.mode == 'prepare'
        run: |
          set -euo pipefail
          if ! gcloud certificate-manager dns-authorizations describe "$DNS_AUTHORIZATION" \
            --location=global >/dev/null 2>&1; then
            gcloud certificate-manager dns-authorizations create "$DNS_AUTHORIZATION" \
              --domain="$DOMAIN" \
              --type=FIXED_RECORD \
              --location=global
          fi

          gcloud certificate-manager dns-authorizations describe "$DNS_AUTHORIZATION" \
            --location=global \
            --format=json \
            | jq -e --arg domain "$DOMAIN" '
                .domain == $domain and .type == "FIXED_RECORD"
              ' >/dev/null || {
                echo "ERROR: DNS authorization is not FIXED_RECORD for the exact apex"
                exit 1
              }

          echo "DNS authorization record to create at the authoritative DNS provider:"
          gcloud certificate-manager dns-authorizations describe "$DNS_AUTHORIZATION" \
            --location=global \
            --format="table(dnsResourceRecord.name,dnsResourceRecord.type,dnsResourceRecord.data)"

          if ! gcloud certificate-manager certificates describe "$CERTIFICATE" \
            --location=global >/dev/null 2>&1; then
            gcloud certificate-manager certificates create "$CERTIFICATE" \
              --domains="$DOMAIN" \
              --dns-authorizations="$DNS_AUTHORIZATION" \
              --location=global
          fi

          gcloud certificate-manager certificates describe "$CERTIFICATE" \
            --location=global \
            --format=json \
            | jq -e --arg domain "$DOMAIN" --arg authorization "$DNS_AUTHORIZATION" '
                (.managed.domains == [$domain]) and
                ((.managed.dnsAuthorizations | length) == 1) and
                (.managed.dnsAuthorizations[0] | endswith("/dnsAuthorizations/" + $authorization))
              ' >/dev/null || {
                echo "ERROR: certificate is not restricted to the exact apex and expected DNS authorization"
                exit 1
              }

          echo "Certificate status:"
          gcloud certificate-manager certificates describe "$CERTIFICATE" \
            --location=global \
            --format="yaml(name,managed.state,managed.authorizationAttemptInfo,expireTime)"
