name: Apex certificate — GCP DNS authorization

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare: create/describe DNS authorization and certificate; attach: attach active certificate map to HTTPS proxy"
        required: true
        type: choice
        options:
          - prepare
          - attach
        default: prepare

concurrency:
  group: apex-certificate
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  DOMAIN: access-ia.pro
  DNS_AUTHORIZATION: accessia-pro-apex-dns-auth
  CERTIFICATE: accessia-pro-apex-cert
  CERTIFICATE_MAP: accessia-pro-apex-cert-map
  CERTIFICATE_MAP_ENTRY: accessia-pro-apex-entry
  GCP_URL_MAP: accessia-pro-lb
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  manage-apex-certificate:
    runs-on: ubuntu-latest
    name: Manage apex-only Certificate Manager resources

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Confirm project and current load balancer path
        run: |
          set -euo pipefail
          echo "Project: $(gcloud config get-value project)"
          gcloud services enable certificatemanager.googleapis.com
          echo "URL map:"
          gcloud compute url-maps describe "$GCP_URL_MAP" \
            --global \
            --format="value(name)" >/dev/null
          gcloud compute target-https-proxies list \
            --global \
            --filter="urlMap~'/global/urlMaps/${GCP_URL_MAP}$'" \
            --format="table(name,certificateMap,sslCertificates.list():label=sslCertificates)"

      - name: Prepare DNS authorization and certificate
        if: inputs.mode == 'prepare'
        run: |
          set -euo pipefail
          if ! gcloud certificate-manager dns-authorizations describe "$DNS_AUTHORIZATION" \
            --location=global >/dev/null 2>&1; then
            gcloud certificate-manager dns-authorizations create "$DNS_AUTHORIZATION" \
              --domain="$DOMAIN" \
              --type=FIXED_RECORD \
              --location=global
          fi

          echo "DNS authorization record to create at the authoritative DNS provider:"
          gcloud certificate-manager dns-authorizations describe "$DNS_AUTHORIZATION" \
            --location=global \
            --format="table(dnsResourceRecord.name,dnsResourceRecord.type,dnsResourceRecord.data)"

          if ! gcloud certificate-manager certificates describe "$CERTIFICATE" \
            --location=global >/dev/null 2>&1; then
            gcloud certificate-manager certificates create "$CERTIFICATE" \
              --domains="$DOMAIN" \
              --dns-authorizations="$DNS_AUTHORIZATION" \
              --location=global
          fi

          echo "Certificate status:"
          gcloud certificate-manager certificates describe "$CERTIFICATE" \
            --location=global \
            --format="yaml(name,managed.state,managed.authorizationAttemptInfo,expireTime)"

      - name: Attach active certificate map to the existing HTTPS proxy
        if: inputs.mode == 'attach'
        run: |
          set -euo pipefail
          CERT_STATE="$(gcloud certificate-manager certificates describe "$CERTIFICATE" \
            --location=global \
            --format='value(managed.state)')"
          if [ "$CERT_STATE" != "ACTIVE" ]; then
            echo "ERROR: certificate $CERTIFICATE is $CERT_STATE, expected ACTIVE"
            gcloud certificate-manager certificates describe "$CERTIFICATE" \
              --location=global \
              --format="yaml(name,managed.state,managed.authorizationAttemptInfo)"
            exit 1
          fi

          if ! gcloud certificate-manager maps describe "$CERTIFICATE_MAP" \
            --location=global >/dev/null 2>&1; then
            gcloud certificate-manager maps create "$CERTIFICATE_MAP" \
              --location=global
          fi

          if ! gcloud certificate-manager maps entries describe "$CERTIFICATE_MAP_ENTRY" \
            --map="$CERTIFICATE_MAP" \
            --location=global >/dev/null 2>&1; then
            gcloud certificate-manager maps entries create "$CERTIFICATE_MAP_ENTRY" \
              --map="$CERTIFICATE_MAP" \
              --certificates="$CERTIFICATE" \
              --hostname="$DOMAIN" \
              --location=global
          fi

          ENTRY_STATE="$(gcloud certificate-manager maps entries describe "$CERTIFICATE_MAP_ENTRY" \
            --map="$CERTIFICATE_MAP" \
            --location=global \
            --format='value(state)')"
          if [ "$ENTRY_STATE" != "ACTIVE" ]; then
            echo "ERROR: certificate map entry is $ENTRY_STATE, expected ACTIVE"
            gcloud certificate-manager maps entries describe "$CERTIFICATE_MAP_ENTRY" \
              --map="$CERTIFICATE_MAP" \
              --location=global \
              --format="yaml(name,state,hostname,certificates)"
            exit 1
          fi

          PROXY_NAME="$(gcloud compute target-https-proxies list \
            --global \
            --filter="urlMap~'/global/urlMaps/${GCP_URL_MAP}$'" \
            --format='value(name)' \
            | head -n 1)"
          if [ -z "$PROXY_NAME" ]; then
            echo "ERROR: no global target HTTPS proxy found for URL map $GCP_URL_MAP"
            exit 1
          fi

          gcloud compute target-https-proxies update "$PROXY_NAME" \
            --certificate-map="$CERTIFICATE_MAP" \
            --global

          echo "Attached certificate map $CERTIFICATE_MAP to HTTPS proxy $PROXY_NAME"
