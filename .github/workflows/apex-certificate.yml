name: Apex migration — GCP read-only audit

on: workflow_dispatch

concurrency:
  group: apex-certificate
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: accessia-pro-web
  GCP_URL_MAP: accessia-pro-lb
  GCP_HTTPS_PROXY: accessia-pro-https-proxy
  GCP_HTTPS_IP: 34.95.112.139
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  manage-apex-certificate:
    runs-on: ubuntu-latest
    name: Audit the current apex load balancer path

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Confirm project and current load balancer path
        run: |
          set -euo pipefail
          PROJECT_ID="$(gcloud config get-value project)"
          if [ "$PROJECT_ID" != "$GCP_PROJECT" ]; then
            echo "ERROR: authenticated project is $PROJECT_ID, expected $GCP_PROJECT"
            exit 1
          fi

          gcloud compute url-maps describe "$GCP_URL_MAP" \
            --global \
            --format="value(name)" >/dev/null

          PROXY_URL_MAP="$(gcloud compute target-https-proxies describe "$GCP_HTTPS_PROXY" \
            --global \
            --format='value(urlMap)')"
          if [ "${PROXY_URL_MAP##*/}" != "$GCP_URL_MAP" ]; then
            echo "ERROR: HTTPS proxy $GCP_HTTPS_PROXY uses ${PROXY_URL_MAP##*/}, expected $GCP_URL_MAP"
            exit 1
          fi

          echo "Project: $PROJECT_ID"
          echo "HTTPS proxy (read-only audit):"
          gcloud compute target-https-proxies describe "$GCP_HTTPS_PROXY" \
            --global \
            --format="yaml(name,urlMap,certificateMap,sslCertificates)"
          echo "URL map host rules (read-only audit):"
          gcloud compute url-maps describe "$GCP_URL_MAP" \
            --global \
            --format="yaml(name,defaultService,hostRules,pathMatchers.name)"
          echo "Forwarding rules (read-only audit):"
          gcloud compute forwarding-rules list \
            --global \
            --filter="target~'/global/targetHttpsProxies/${GCP_HTTPS_PROXY}$'" \
            --format="table(name,IPAddress,IPProtocol,portRange,target)"

          gcloud compute forwarding-rules list \
            --global \
            --filter="target~'/global/targetHttpsProxies/${GCP_HTTPS_PROXY}$'" \
            --format=json \
            | jq -e --arg ip "$GCP_HTTPS_IP" '
                (length == 1) and
                (.[0].IPAddress == $ip) and
                (.[0].IPProtocol == "TCP") and
                (.[0].portRange == "443-443")
              ' >/dev/null || {
                echo "ERROR: HTTPS proxy does not resolve uniquely to $GCP_HTTPS_IP:443"
                exit 1
              }
